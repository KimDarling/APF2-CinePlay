<!DOCTYPE html>
<html lang="es">
    <head>
        <title>CinePlay - Pago y Contacto</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!-- Google Fonts & Font Awesome -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

        <!-- Conexión con la hoja de estilos -->
        <link rel="stylesheet" href="estilos.css">
    </head>

    <body>

        <!-- ENCABEZADO Y LOGO DE CINEPLAY -->
        <header>
            <h1>
                <span>CINE</span><span>PLAY</span>
            </h1>

            <p>Reserva de Entradas y Atención al Cliente</p>

            <!-- Menú de navegación con íconos -->
            <nav>
                <ul>
                    <li><a href="index.html"><i class="fa-solid fa-house"></i> Inicio</a></li>
                    <li><a href="pago-contacto.html"><i class="fa-solid fa-ticket"></i> Pago y Contacto</a></li>
                    <li><a href="horarios.html"><i class="fa-solid fa-calendar-days"></i> Horarios</a></li>
                    <li><a href="galeria.html"><i class="fa-solid fa-film"></i> Galería</a></li>
                </ul>
            </nav>
        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main>

            <!-- FORMULARIO DE PAGO -->
            <section>
                <h2><i class="fa-solid fa-credit-card"></i> Formulario de Pago</h2>

                <form action="tabla-pago.html" method="get">

                    <fieldset>
                        <legend>Detalles de la Compra</legend>

                        <p>
                            <label for="pelicula">Película seleccionada:</label><br>
                            <select id="pelicula" name="pelicula" required>
                                <option value="">-- Selecciona una película --</option>
                                <option value="moda2">El Diablo Viste a la Moda 2</option>
                                <option value="revelacion">El Día de la Revelación</option>
                                <option value="endoakstreet">The End of Oak Street</option>
                                <option value="noche-demonio">La Noche del Demonio</option>
                                <option value="odisea">La Odisea</option>
                            </select>
                        </p>

                        <p>
                            <label for="funcion">Horario / Función:</label><br>
                            <select id="funcion" name="funcion" required>
                                <option value="">-- Selecciona un horario --</option>
                                <option value="17:00">05:00 PM - El Día de la Revelación</option>
                                <option value="18:00">06:00 PM - The End of Oak Street</option>
                                <option value="19:00">07:00 PM - El Diablo Viste a la Moda 2</option>
                                <option value="20:00">08:00 PM - La Odisea</option>
                                <option value="21:45">09:45 PM - La Noche del Demonio</option>
                            </select>
                        </p>

                        <p>
                            <label for="cantidad">Cantidad de entradas:</label><br>
                            <input type="number" id="cantidad" name="cantidad" min="1" max="10" value="1" required>
                        </p>

                    </fieldset>


                    <fieldset>
                        <legend>Información de la Tarjeta</legend>

                        <p>
                            <label for="nombre-tarjeta">Nombre del titular:</label><br>
                            <input type="text" id="nombre-tarjeta" name="nombre_tarjeta" placeholder="Ej. Juan Pérez" required>
                        </p>

                        <p>
                            <label for="numero-tarjeta">Número de tarjeta:</label><br>
                            <input type="text" id="numero-tarjeta" name="numero_tarjeta" placeholder="Ingrese 16 dígitos" maxlength="16" required>
                        </p>

                        <p>
                            <label for="expiracion">Fecha de expiración:</label><br>
                            <input type="month" id="expiracion" name="expiracion" required>
                        </p>

                        <p>
                            <label for="cvv">Código de seguridad (CVV):</label><br>
                            <input type="password" id="cvv" name="cvv" placeholder="123" maxlength="4" required>
                        </p>

                    </fieldset>

                    <p>
                        <button type="submit">Pagar Entradas</button>
                    </p>

                </form>
            </section>


            <!-- FORMULARIO DE CONTACTO -->
            <section>
                <h2><i class="fa-solid fa-headset"></i> Formulario de Contacto</h2>

                <form action="tabla-contacto.html" method="get">

                    <fieldset>
                        <legend>Envíanos tu Mensaje</legend>

                        <p>
                            <label for="nombre-contacto">Nombre completo:</label><br>
                            <input type="text" id="nombre-contacto" name="nombre_contacto" placeholder="Ej. Ana Gómez" required>
                        </p>

                        <p>
                            <label for="email-contacto">Correo electrónico:</label><br>
                            <input type="email" id="email-contacto" name="email_contacto" placeholder="ejemplo@correo.com" required>
                        </p>

                        <p>
                            <label for="asunto">Asunto:</label><br>
                            <select id="asunto" name="asunto" required>
                                <option value="">-- Selecciona el motivo --</option>
                                <option value="consulta">Consulta General</option>
                                <option value="reclamo">Reclamo / Queja</option>
                                <option value="sugerencia">Sugerencia</option>
                            </select>
                        </p>

                        <p>
                            <label for="mensaje">Mensaje:</label><br>
                            <textarea id="mensaje" name="mensaje" rows="5" cols="40" placeholder="Escribe tu mensaje aquí..." required></textarea>
                        </p>

                    </fieldset>

                    <p>
                        <button type="submit">Enviar Mensaje</button>
                    </p>

                </form>
            </section>

        </main>

        <!-- PIE DE PÁGINA -->
        <footer>
            <p>&copy; 2026 CinePlay. Todos los derechos reservados.</p>
        </footer>

    </body>
</html>
